name: 'Publish Release'
on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install Frontend Dependencies
        run: npm install
      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: __VERSION__
          releaseName: 'Version __VERSION__'
          releaseBody: 'Release metadata will be finalized from RELEASE_NOTES.md after the build completes.'
          releaseDraft: false
          prerelease: false
      - name: Apply release title and notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          gh release edit $tag --title "Version $version" --notes-file RELEASE_NOTES.md
